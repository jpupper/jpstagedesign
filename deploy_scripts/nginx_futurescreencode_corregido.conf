server {
    server_name fullscreencode.com www.fullscreencode.com;

    # APLICACION: Arte Digital Data (puerto 2495)
    location / {
        proxy_pass http://localhost:2495;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Cookie $http_cookie;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }

    # APLICACION: Arte Digital Data (puerto 2495)
    location /artedigitaldata {
        proxy_pass http://localhost:2495;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Cookie $http_cookie;
        client_max_body_size 100M;
        proxy_read_timeout 86400;
    }

    # APLICACION: DomainMaster (puerto 3245)
    location /domainmaster {
        proxy_pass http://localhost:3245;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Cookie $http_cookie;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }

    # APLICACION: FutureX FSC (puerto 3244)
    # Accesible en: https://fullscreencode.com/futurex/
    location /futurex {
        proxy_pass http://localhost:3244;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    listen 80;
    listen [::]:80;
}

server {
    if ($host = www.fullscreencode.com) {
        return 301 https://fullscreencode.com$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name fullscreencode.com www.fullscreencode.com;
    return 301 https://fullscreencode.com$request_uri;
}

