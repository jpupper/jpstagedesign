<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Visor de modelo (escala real, sin normalizar)</title>
<style>html,body{margin:0;height:100%;background:#151a22;overflow:hidden;font-family:monospace;color:#cfd6e2}
#lab{position:fixed;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:60px;font-size:13px;z-index:5}
#err{position:fixed;left:8px;top:8px;font-size:12px;color:#ff6b81;white-space:pre-line}</style>
</head>
<body>
<div id="lab"></div><div id="err"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const FILES = (new URLSearchParams(location.search).get('file') || '').split(',').filter(Boolean);
const S = Number(new URLSearchParams(location.search).get('s') || 1);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x151a22);
const cam = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.05, 200);
const ren = new THREE.WebGLRenderer({antialias:true}); ren.setPixelRatio(1); ren.setSize(innerWidth, innerHeight); document.body.appendChild(ren.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const l1 = new THREE.DirectionalLight(0xffffff, 0.75); l1.position.set(3,6,5); scene.add(l1);
const l2 = new THREE.DirectionalLight(0xffffff, 0.35); l2.position.set(-4,3,-3); scene.add(l2);
const fl = new THREE.Mesh(new THREE.PlaneGeometry(30,30), new THREE.MeshStandardMaterial({color:0x2c323d, roughness:1})); fl.rotation.x=-Math.PI/2; scene.add(fl);
scene.add(new THREE.GridHelper(30, 60, 0x46505f, 0x252b34));
const lab = document.getElementById('lab');
FILES.forEach((f, i) => {
  const d = document.createElement('div'); d.textContent = f; lab.appendChild(d);
  new THREE.GLTFLoader().load(f, (g) => {
    const r = g.scene; r.scale.setScalar(S);
    r.position.x = (i - (FILES.length-1)/2) * 1.3;
    r.traverse(n => { if (n.isMesh || n.isSkinnedMesh) { n.castShadow = true; n.receiveShadow = true; } });
    scene.add(r);
    const b = new THREE.Box3().setFromObject(r); const sz = new THREE.Vector3(); b.getSize(sz);
    d.textContent = f + '  (alto ' + sz.y.toFixed(2) + ' m)';
  }, undefined, (e) => { document.getElementById('err').textContent += 'ERROR ' + f + '\n'; });
});
cam.position.set(0, 1.35, 3.4); cam.lookAt(0, 0.95, 0);
(function loop(){ ren.render(scene, cam); requestAnimationFrame(loop); })();
</script>
</body>
</html>
