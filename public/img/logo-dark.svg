    <text x="34" y="22" font-family="'Metropolis', 'Montserrat', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="20" fill="#1a1c23" letter-spacing="1.5">STAGE</text>
    <text x="1" y="36" font-family="'Consolas', 'Courier New', monospace" font-weight="700" font-size="9" fill="#007799" letter-spacing="3.8">DESIGN 3D</text>
    <circle cx="118" cy="33" r="2" fill="#00aa66" />
