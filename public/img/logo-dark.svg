      <stop offset="0%" stop-color="#00a8cc" />
      <stop offset="100%" stop-color="#0056b3" />
    </linearGradient>
    <linearGradient id="neonPurpleDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e44ad" />
      <stop offset="100%" stop-color="#0099cc" />
    </linearGradient>
  </defs>

  <!-- Stage Box / Beam Icon -->
  <g transform="translate(6, 8)">
    <polygon points="4,34 16,18 36,18 48,34" fill="rgba(0, 168, 204, 0.12)" stroke="url(#neonCyanDark)" stroke-width="1.5" stroke-linejoin="round" />
    <line x1="4" y1="34" x2="26" y2="4" stroke="url(#neonPurpleDark)" stroke-width="1.8" stroke-linecap="round" />
    <line x1="48" y1="34" x2="26" y2="4" stroke="url(#neonPurpleDark)" stroke-width="1.8" stroke-linecap="round" />
    <line x1="16" y1="18" x2="26" y2="4" stroke="#00a8cc" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2" />
    <line x1="36" y1="18" x2="26" y2="4" stroke="#00a8cc" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2" />
    
    <circle cx="26" cy="4" r="3.2" fill="#00a8cc" />
    <circle cx="26" cy="4" r="5.5" fill="none" stroke="#00a8cc" stroke-width="0.8" opacity="0.6" />
    
    <circle cx="16" cy="18" r="1.5" fill="#00a8cc" />
    <circle cx="36" cy="18" r="1.5" fill="#00a8cc" />
    <circle cx="4" cy="34" r="2" fill="#00a8cc" />
    <circle cx="48" cy="34" r="2" fill="#00a8cc" />
  </g>

