<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 72" width="268" height="72" fill="none">
  <title>JPStageDesign · eje de escena con medidas y luz</title>
  <defs>
    <linearGradient id="jpBeam" x1="58" y1="9" x2="26" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff3b1f" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#ff3b1f" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff3b1f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="jpSpot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd0a8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ff3b1f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff3b1f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ================= SÍMBOLO: eje isométrico X / Y / Z ================= -->
  <ellipse cx="34" cy="61" rx="27" ry="8.5" stroke="#0b0b0b" stroke-opacity="0.26" stroke-width="1.4" stroke-dasharray="2.5 3.5"/>

  <g stroke="#0b0b0b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="34" y1="60" x2="34" y2="10"/>
    <path d="M34 8 L30.4 15.6 M34 8 L37.6 15.6"/>
    <line x1="34" y1="60" x2="66" y2="60"/>
    <path d="M68 60 L60.4 56.4 M68 60 L60.4 63.6"/>
    <line x1="34" y1="60" x2="13" y2="47.5" stroke-dasharray="3.4 3.4" stroke-width="2.2"/>
    <path d="M11.2 46.4 L19.6 45.8 M11.2 46.4 L15.6 53" stroke-width="2.2"/>
  </g>

  <!-- marcas de medición sobre los ejes -->
  <g stroke="#0b0b0b" stroke-width="1.8" stroke-linecap="round">
    <line x1="29.5" y1="46" x2="38.5" y2="46"/>
    <line x1="29.5" y1="32" x2="38.5" y2="32"/>
    <line x1="29.5" y1="18" x2="38.5" y2="18"/>
    <line x1="45" y1="55.5" x2="45" y2="64.5"/>
    <line x1="57" y1="55.5" x2="57" y2="64.5"/>
  </g>

  <!-- cota de altura en rojo (flechas arriba/abajo) -->
  <g stroke="#ff2b2b" stroke-width="1.6" stroke-linecap="round">
    <line x1="70" y1="15" x2="70" y2="57"/>
    <path d="M70 11.4 L67.4 17.2 M70 11.4 L72.6 17.2"/>
    <path d="M70 60.6 L67.4 54.8 M70 60.6 L72.6 54.8"/>
    <line x1="65.6" y1="15" x2="73.4" y2="15" stroke-width="1.2"/>
    <line x1="65.6" y1="57" x2="73.4" y2="57" stroke-width="1.2"/>
  </g>

  <!-- LUZ: haz desde el foco hasta el origen -->
  <path d="M58 10 L26 56 L42 56 Z" fill="url(#jpBeam)"/>
  <circle cx="58" cy="10" r="13" fill="url(#jpSpot)"/>
  <circle cx="58" cy="10" r="3.1" fill="#ff2b2b"/>
  <g stroke="#ff2b2b" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
    <line x1="58" y1="3.4" x2="58" y2="1.4"/>
    <line x1="64.2" y1="4.8" x2="65.6" y2="3.4"/>
    <line x1="51.8" y1="4.8" x2="50.4" y2="3.4"/>
  </g>

  <!-- origen -->
  <circle cx="34" cy="60" r="6.6" stroke="#ff2b2b" stroke-width="1.3" fill="none" opacity="0.85"/>
  <circle cx="34" cy="60" r="3.4" fill="#0b0b0b"/>

  <!-- ================= WORDMARK ================= -->
  <text x="92" y="38" font-family="Consolas, 'Courier New', monospace" font-size="21" letter-spacing="1.4" fill="#0b0b0b">JPSTAGE</text>
  <text x="198" y="38" font-family="Consolas, 'Courier New', monospace" font-size="21" letter-spacing="1.4" fill="#ff2b2b">DESIGN</text>
  <line x1="92" y1="45.5" x2="258" y2="45.5" stroke="#0b0b0b" stroke-width="1" opacity="0.5"/>
  <text x="90" y="56.5" font-family="Consolas, 'Courier New', monospace" font-size="6.6" letter-spacing="2.1" fill="#6b6b6b">ESCENA · MEDIDAS · LUZ</text>
</svg>
