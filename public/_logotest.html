<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;padding:24px;background:#fff;font-family:monospace}
  .row{display:flex;align-items:center;gap:26px;padding:14px 0;border-bottom:1px dashed #ccc}
  .dark{background:#111;color:#eee}
  .tag{font-size:11px;color:#888;width:110px}
  img{display:block}
</style></head><body>
  <div class="row"><span class="tag">header 38px</span><img src="/jpstagedesign/img/logo.svg" style="height:38px"></div>
  <div class="row"><span class="tag">tablet 64px</span><img src="/jpstagedesign/img/logo.svg" style="height:64px"></div>
  <div class="row"><span class="tag">grande 120px</span><img src="/jpstagedesign/img/logo.svg" style="height:120px"></div>
  <div class="row dark"><span class="tag" style="color:#aaa">dark 64px</span><img src="/jpstagedesign/img/logo.svg" style="height:64px;filter:invert(1) hue-rotate(180deg)"></div>
</body></html>
